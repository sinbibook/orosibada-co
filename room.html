<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:,">
    <title>남해 오롯이바다 풀빌라&amp;펜션 - 객실안내</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/room.css" />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="남해 오롯이바다 풀빌라&펜션 - 객실안내" />
  <meta property="og:description" content="남해 오롯이바다 풀빌라에서 탁 트인 오션뷰와 프라이빗 수영장, 개별바베큐를 즐기며 커플·가족과 함께 바다 감성 가득한 힐링을 경험해보세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/15/kg7Wj13BM6Pz.jpg" />
  <meta property="og:url" content="https://orosibada.co.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="남해 오롯이바다 풀빌라&펜션 - 객실안내" />
  <meta name="twitter:description" content="남해 오롯이바다 풀빌라에서 탁 트인 오션뷰와 프라이빗 수영장, 개별바베큐를 즐기며 커플·가족과 함께 바다 감성 가득한 힐링을 경험해보세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/15/kg7Wj13BM6Pz.jpg" />
  <meta name="naver-site-verification" content="5714b53105bc5faca818e9a4ea682ed11e1efcaa" />
  <meta name="google-site-verification" content="Z0QtM7vb2NuW7Wa9n62PF-EjmyNI7ZRlXvuNHVCw7-M" />
</head>
  <body>
    <div class="wrapper">
<div class="container">
        <!-- MAPPER: property.rooms[current].images[0].interior[isSelected] + name -->
        <div class="con0" data-aos="fade-up">
          <div class="swiper-container">
            <div class="swiper-wrapper"></div>
            <div class="swiperNavi">
              <div class="swiper-button-prev">
                <img src="images/icon_arrow_left_1.png" alt="" />
                Prev
              </div>
              <div class="bar"></div>
              <div class="swiper-button-next">
                Next
                <img src="images/icon_arrow_right_1.png" alt="" />
              </div>
            </div>
          </div>
          <div class="tx1"></div>
        </div>

        <!-- MAPPER: property.rooms[] (layout-map + active rooms) -->
        <div id="snb_wrap">
          <ul data-room-nav-list>
            <li class="active"><a href="layout-map.html">미리보기</a></li>
          </ul>
        </div>
        <!-- MAPPER: property.rooms[current] (name, description, bedTypes, roomStructures, usageGuide, images[0].thumbnail[0], images[0].interior[0]) -->
        <div class="con6 w1440">
          <div class="item">
            <div class="left" data-aos="fade-up">
              <div class="img">
                <img alt="" />
              </div>
            </div>
            <div class="right" data-aos="fade-up">
              <div class="tx1">ROOMS</div>
              <div class="tx2"></div>
              <div class="tx3"></div>
              <div class="tx1">NOTICE</div>
              <div class="tx4">※ 자세한 내용은 예약안내 페이지 참고 부탁드립니다.</div>
              <div class="img">
                <img alt="" />
                <div class="tx5">
                  LET'S ENJOY A FREE AND FUN DAY HERE,<br />
                  WHICH IS SPACIOUS
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- MAPPER: property.rooms[current] (name, size, roomStructures, baseOccupancy, maxOccupancy) -->
        <div class="con8 w1440" data-aos="fade-up">
          <!-- PC 버전 -->
          <div class="price_table for_pc">
            <table cellspacing="0" cellpadding="0" class="table_default">
              <thead>
                <tr>
                  <th style="width: 15%;">객실명</th>
                  <th style="width: 5%;">기준</th>
                  <th style="width: 5%;">최대</th>
                  <th style="width: 20%;">유형</th>
                  <th style="width: 20%;">평형</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
            <!-- MAPPER: rooms[current].amenities (집기품목) -->
            <ul class="table_text">
              <li>
                <strong>집기품목</strong> :
                <span data-room-amenities></span>
              </li>
            </ul>
          </div>
        </div>
        <!-- MAPPER: rooms[current].images[0].exterior[0,1,2] -->
        <div class="con7">
          <div class="w1440">
            <div
              class="img"
              data-aos="fade-up"
              data-aos-delay="400"
            ></div>
            <div class="center" data-aos="fade-up">
              <div class="tx1 travelFont">I support your beautiful trip</div>
              <!-- tx2: 하드코딩 유지 -->
              <div class="tx2">
                특별한 장소가 주는 특별한 하루<br />
                이곳에서 최상의 휴식을 경험하세요.
              </div>
              <div class="img"></div>
            </div>
            <div
              class="img"
              data-aos="fade-up"
              data-aos-delay="900"
            ></div>
          </div>
        </div>
        <!-- s: 객실 평면도 — 원본 객실 상세의 평면도 크롤링 이미지가 있을 때만 노출.
             제목 영역 없이 도면 이미지 한 장만 놓는다. 없으면 매퍼가 구간째 숨긴다. -->
        <div class="room_floorplan" data-room-floorplan-section style="display: none">
          <!-- data-* : data-room-floorplan-image
               roomtypes[current] 평면도 이미지 → 없으면 섹션 미노출 -->
          <img alt="객실 평면도" data-room-floorplan-image />
        </div>
        <!--// 객실 평면도 -->
        <!-- MAPPER: rooms[] (including current - thumbnail + name) -->
        <div class="con3">
          <div class="w1440">
            <div class="conTitle" data-aos="fade-up">
              <div class="subTitle">
              </div>
              <div class="title">
              </div>
            </div>
            <div class="swiper-container" data-aos="fade-up">
              <div class="swiper-wrapper" data-room-list-slides></div>
              <div class="swiperNavi">
                <div class="swiper-button-prev">
                  <img src="images/icon_arrow_left_2.png" alt="" />
                </div>
                <div class="bar"></div>
                <div class="swiper-button-next">
                  <img src="images/icon_arrow_right_2.png" alt="" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="https://code.jquery.com/jquery-latest.min.js"></script>
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@beta/bundled/locomotive-scroll.min.js"></script>
  <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
  <script src="js/data-mapper/core/base-mapper.js"></script>
  <script src="js/data-mapper/pages/room-mapper.js"></script>
  <script src="js/image-helpers.js"></script>
  <script src="js/preview-handler.js"></script>
  <script src="js/header-footer-loader.js"></script>
  <script src="js/common.js"></script>
</html>
